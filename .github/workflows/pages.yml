# 静的ファイルをそのまま GitHub Pages へ配信する。
# Jekyll ビルドは通さない（リポジトリ直下の `.nojekyll` と対になる設計）。
#
# ⚠ フレームワークの配布時は **オプトイン制** です（クローン/フォーク直後は何もしません）。
#   公開したくなったら次の 2 つを設定してください:
#     1. Settings → Pages → Source を「GitHub Actions」にする
#        （未設定でも下の configure-pages が自動有効化を試みます）
#     2. Settings → Secrets and variables → Actions → Variables に
#        `ENABLE_PAGES` = `true` を追加する
#   設定するまで push 時のジョブは skip（灰色）になり、赤い失敗ログは出ません。
#   1 回だけ試すなら Actions タブからの手動実行（Run workflow）で変数なしでも動きます。
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は 1 本に絞る。実行中のデプロイはキャンセルしない。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # オプトインの門番。変数が無い環境（配布直後のフォーク等）では丸ごと skip する。
    # deploy は needs: build なので連鎖して skip される。
    if: vars.ENABLE_PAGES == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # データ整合性が壊れたまま公開しないための門番
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Pages が未設定のリポジトリ（フォーク直後・新規作成直後など）でも自動で有効化する。
          # これが無いと "Get Pages site failed / Not Found" でビルドが落ちる。
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
