# 静的ファイルをそのまま GitHub Pages へ配信する。
# Jekyll ビルドは通さない（リポジトリ直下の `.nojekyll` と対になる設計）。
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は 1 本に絞る。実行中のデプロイはキャンセルしない。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # データ整合性が壊れたまま公開しないための門番
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
